    const opt = (k, t, d, ic) => `<button class="opt" data-level="${k}" aria-pressed="${S.level === k}"><span class="between">${I(ic)}<span class="caps ${S.level === k ? 'brass' : 'muted'}">${S.level === k ? 'ОБРАНО' : ''}</span></span><span class="display h3">${t}</span><span class="muted" style="font-size:13px;line-height:1.45">${d}</span></button>`;

      <h1 class="display" style="font-size:36px;line-height:1.1;margin-top:14px">Грай розумніше.<br>Знай більше.</h1>

      <div class="divider" style="width:100%"><span class="caps">ВАШ ДОСВІД У ГРІ</span></div>

  function newsCard(n) {

  }
  function vNews() {
    const f = NEWS.find(n => n.featured);
    const q = S.newsQ.trim().toLowerCase();
    const list = NEWS.filter(n => !n.featured || S.cat !== 'all' || q).filter(n => S.cat === 'all' || n.cat === S.cat).filter(n => !q || (n.title + ' ' + n.lead).toLowerCase().includes(q));
    const tipsForLevel = TIPS.filter(t => t.lvl === S.level); const tip = tipsForLevel[S.tipIdx % tipsForLevel.length];
    return `<div class="screen">
      <header class="top"><div class="logo">${emblem()}<div><b>DEADLOCK</b><small>NEWS</small></div></div>
        <div class="row"><button class="icon-btn" data-act="toggle-search" aria-label="Пошук новин">${I('search')}</button><button class="icon-btn" data-go="#article-${NEWS[0].id}" aria-label="Останній патч">${I('bell')}${S.mark ? '<span class="dot"></span>' : ''}</button></div></header>
      ${S.newsSearch ? `<label class="search">${I('search')}<input id="news-q" type="search" placeholder="Пошук у новинах" value="${esc(S.newsQ)}" autocomplete="off"></label>` : ''}
      ${S.cat === 'all' && !q ? `<button class="hero-news" style="--c:${TONE[f.tone]}" data-go="#article-${f.id}">${burst(358, 250, f.tone, 290, 80)}<div class="in">${tag('ПАТЧ ТИЖНЯ', f.tone)}<h2 class="display" style="font-size:27px;line-height:1.12">${esc(f.title)}</h2><span class="meta">${I('clock', 's')}${esc(f.date)} · ${f.read} хв читання</span></div></button>` : ''}
      <div class="chips" role="group" aria-label="Категорії">${CATS.map(([k, l]) => `<button class="chip caps" data-cat="${k}" aria-pressed="${S.cat === k}">${l}</button>`).join('')}</div>
      ${S.cat === 'all' && !q ? `<button class="tip" data-act="next-tip"><span class="box">${I('tips')}</span><span style="display:flex;flex-direction:column;gap:4px"><span class="between"><span class="caps" style="color:var(--soul)">ПОРАДА ДНЯ</span><span class="caps muted">ЩЕ ›</span></span><span class="quote">«${esc(tip.text)}»</span></span></button>` : ''}
      <div class="between"><h2 class="display h2">${q ? 'Знайдено' : S.cat === 'all' ? 'Останні новини' : CATS.find(c => c[0] === S.cat)[1].toLowerCase().replace(/^./, c => c.toUpperCase())}</h2><span class="caps muted">${list.length}</span></div>
      <div style="display:flex;flex-direction:column;gap:12px">${list.map(newsCard).join('') || '<p class="muted">Нічого не знайдено. Спробуйте інше слово.</p>'}</div>
      <p class="muted" style="font-size:12px;margin:0">Новини зібрані з відкритих джерел станом на 3 листопада 2026. Джерела — внизу кожної статті.</p>
    </div>${tabbar('news')}`;
  }

  function vArticle(id) {
    const n = NEWS.find(x => x.id === id) || NEWS[0];
    const blocks = n.body.map(([t, v]) => {
      if (t === 'p') return `<p>${esc(v)}</p>`;
      if (t === 'h') return `<h2 class="display h2" style="margin-top:6px">${esc(v)}</h2>`;
      if (t === 'list') return `<ul>${v.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ul>`;
      if (t === 'quote') return `<div class="blockquote"><p class="quote">«${esc(v)}»</p></div>`;
      if (t === 'changes') return `<div class="card changes">${v.map(([h, k, d]) => { const tone = k === 'buff' ? 'soul' : 'blood'; const hero = HEROES.find(x => x.name === h);
        return `<${hero ? `button data-hero="${hero.slug}"` : 'div'} class="change" style="--c:${TONE[tone]};text-align:left"><span class="ib">${I(k === 'buff' ? 'up' : 'down')}</span><div><div style="font-weight:600">${esc(h)}</div><div class="muted" style="font-size:13px">${esc(d)}</div></div>${tag(k === 'buff' ? 'БАФ' : 'НЕРФ', tone)}</${hero ? 'button' : 'div'}>`; }).join('')}</div>`;
      return '';
    }).join('');
    const saved = S.bm.has(n.id);
    return `<div class="screen" style="gap:16px">
      <header class="top"><button class="icon-btn" data-act="back" aria-label="Назад">${I('back')}</button><div class="row"><button class="icon-btn" data-act="bookmark" data-id="${n.id}" aria-label="${saved ? 'Прибрати із закладок' : 'Зберегти'}" aria-pressed="${saved}" style="${saved ? 'color:var(--brass);border-color:var(--brass)' : ''}">${I('bookmark')}</button><button class="icon-btn" data-act="share" data-id="${n.id}" aria-label="Скопіювати посилання">${I('share')}</button></div></header>
      <div class="article-art">${burst(390, 230, n.tone, 195, 150, { from: 180, to: 360, step: 6, len: 420, arcs: true, rings: [60, 95, 130, 170] })}</div>
      <div class="row" style="margin-top:-60px;position:relative">${tag(n.tag, n.tone)}<span class="caps muted">${esc(n.date)}</span></div>
      <h1 class="display h1">${esc(n.title)}</h1>
      <div class="row" style="gap:10px">${emblem(28)}<div><div style="font-weight:600">${n.steam ? 'Valve · Steam' : 'Редакція DeadlockNews'}</div><div class="muted" style="font-size:13px">${n.read} хв читання</div></div></div>
      <div class="divider"><span style="color:var(--brass)">◆</span></div>
      <div class="prose"><p style="font-size:16px">${esc(n.lead)}</p>${blocks}</div>
      <div class="sources"><span class="caps">ДЖЕРЕЛА</span>${(n.sources || []).map(k => `<a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`).join('')}${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener">Оригінал у Steam ›</a>` : ''}${n.steam ? '<span>Офіційна новина Valve, мова оригіналу — англійська.</span>' : ''}</div>
    </div>${tabbar('news')}`;
  }

  function vTips() {
    const tips = TIPS.filter(t => t.lvl === S.level && (!S.tipSec || t.sec === S.tipSec));
    const day = TIPS.filter(t => t.lvl === S.level); const tip = day[S.tipIdx % day.length];
    return `<div class="screen">${topTitle('НАВЧАННЯ', 'Поради')}
      <div class="seg-switch" role="group" aria-label="Рівень">${[['novice', 'НОВАЧОК'], ['veteran', 'ВЕТЕРАН']].map(([k, l]) => `<button data-level="${k}" aria-pressed="${S.level === k}">${l}</button>`).join('')}</div>
      <div class="featured-tip">${tag('ПОРАДА ДНЯ', 'soul')}<p class="quote" style="font-size:20px">«${esc(tip.text)}»</p>
        <div class="between" style="align-items:center"><span class="caps muted">${(S.tipIdx % day.length) + 1} З ${day.length}</span><button class="caps brass row" data-act="next-tip">НАСТУПНА ${I('chevron', 's')}</button></div></div>
      <div class="between"><h2 class="display h2">Розділи</h2>${S.tipSec ? '<button class="caps brass" data-sec="">УСІ ×</button>' : ''}</div>
      <div class="grid2">${TIP_SECTIONS.map(([k, l, ic, tone]) => { const c = TIPS.filter(t => t.sec === k && t.lvl === S.level).length;
        return `<button class="card section" style="--c:${TONE[tone]}" data-sec="${S.tipSec === k ? '' : k}" aria-pressed="${S.tipSec === k}"><span class="ib">${I(ic)}</span><div><div style="font-weight:600;font-size:14px;line-height:1.25">${l}</div><div class="muted" style="font-size:12.5px">${c} ${c === 1 ? 'порада' : c > 1 && c < 5 ? 'поради' : 'порад'}</div></div></button>`; }).join('')}</div>
      <div class="between"><h2 class="display h2">${S.tipSec ? TIP_SECTIONS.find(s => s[0] === S.tipSec)[1] : 'Усі поради'}</h2><span class="caps muted">${S.level === 'novice' ? 'ДЛЯ НОВАЧКІВ' : 'ДЛЯ ВЕТЕРАНІВ'}</span></div>
      <div class="tip-list">${tips.map(t => { const s = TIP_SECTIONS.find(x => x[0] === t.sec); return `<div class="card tip-item" style="--c:${TONE[s[3]]}"><span class="caps" style="color:var(--c)">${s[1].toUpperCase()}</span><span>${esc(t.text)}</span></div>`; }).join('') || '<p class="muted">У цьому розділі поки немає порад для вашого рівня.</p>'}</div>
    </div>${tabbar('tips')}`;
  }

  function vAnalysis() {
    const issues = [
      ['warning', 'blood', 'КРИТИЧНО', 'Смерті без підтримки', '4 з 6 смертей — сам на лінії після 15-ї хвилини. Відступайте до команди, коли суперників не видно на мапі.', 'team'],
      ['clock', 'amber', 'СЕРЕДНЬО', 'Пропущені душі', 'Ви підтвердили 61% душ із трупперів. Ціль для вашого рівня — 75% і більше.', 'lane'],
      ['check', 'soul', 'ДОБРЕ', 'Вчасний ультимейт', '3 з 4 ультимейтів принесли вбивство або допомогу.', null],
    ];
    return `<div class="screen">${topTitle('ОСТАННІЙ МАТЧ', 'Аналіз матчу', tag('ПЕРЕМОГА', 'amber'))}
      <div class="demo-note">Це демо-матч для прикладу. Щоб аналізувати ваші справжні ігри, застосунку потрібен доступ до статистики Deadlock.</div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:16px">
        <button class="row" style="gap:14px;text-align:left" data-hero="haze">${portrait(HEROES.find(h => h.slug === 'haze'))}<div style="flex:1;min-width:0"><div class="display h2">Haze</div><div class="muted" style="font-size:13px">Команда Амбер · 32 хв</div></div><div style="text-align:right"><div class="num brass">72</div><div class="caps muted">/100</div></div></button>
        <div class="stats">${[['8/6/11', 'K / D / A'], ['1 240', 'ДУШІ / ХВ'], ['38.2K', 'ШКОДА']].map(([v, l]) => `<div><span class="num" style="font-size:21px">${v}</span><span class="caps muted" style="font-size:10px">${l}</span></div>`).join('')}</div>
        <div style="display:flex;flex-direction:column;gap:8px"><div class="between"><span class="caps muted">ВАША ГРА</span><span class="caps" style="color:var(--soul)">ВИЩЕ ЗА 64% ГРАВЦІВ</span></div><div class="segs">${Array.from({ length: 10 }, (_, i) => `<i class="${i < 7 ? 'on' : ''}"></i>`).join('')}</div></div>
      </div>
      <div class="between"><h2 class="display h2">Що покращити</h2><span class="caps muted">${issues.length} ПУНКТИ</span></div>
      <div style="display:flex;flex-direction:column;gap:10px">${issues.map(([ic, tone, l, t, d, sec]) => `<button class="card issue" style="--c:${TONE[tone]}" ${sec ? `data-go="#tips" data-sec-go="${sec}"` : 'disabled'}><span class="ib">${I(ic)}</span><div><span class="between" style="align-items:center"><span style="font-weight:600">${t}</span>${tag(l, tone)}</span><span class="muted" style="font-size:13px;line-height:1.45">${d}</span>${sec ? `<span class="caps brass">ДИВИТИСЬ ПОРАДИ ›</span>` : ''}</div></button>`).join('')}</div>

  function vHeroes() {

    const filters = [['all', 'УСІ'], ['new', 'НОВІ'], ['fav', 'УЛЮБЛЕНІ'], ...Object.entries(ROLES).map(([k, v]) => [k, v.toUpperCase()])];

      <div class="chips" role="group" aria-label="Фільтр">${filters.map(([k, l]) => `<button class="chip caps" data-role="${k}" aria-pressed="${S.heroRole === k}">${l}</button>`).join('')}</div>

    </div>${tabbar('heroes')}`;

  function vProfile() {
    const vals = [56, 61, 58, 64, 60, 67, 63, 70, 66, 72], x0 = 34, x1 = 318, y0 = 104, y1 = 16;
    const pts = vals.map((v, i) => [x0 + i * (x1 - x0) / 9, y0 - (v - 50) / 30 * (y0 - y1)]);
    const path = 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join(' L');
    const chart = `<svg class="chart" viewBox="0 0 330 120" role="img" aria-label="Оцінка за 10 матчів: від 56 до 72"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brass);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--brass);stop-opacity:0"/></linearGradient></defs>
      ${[[104, 50], [60, 65], [16, 80]].map(([y, l]) => `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" style="stroke:var(--line)" stroke-dasharray="2 4"/><text x="26" y="${y + 4}" text-anchor="end" style="fill:var(--muted);font:10px var(--f-body)">${l}</text>`).join('')}
      <path d="${path} L${x1} ${y0} L${x0} ${y0}Z" fill="url(#pg)"/><path d="${path}" fill="none" style="stroke:var(--brass)" stroke-width="2"/>
      ${pts.slice(0, -1).map(([x, y]) => dia(+x.toFixed(1), +y.toFixed(1), 3, 'var(--bg)', 'var(--brass)')).join('')}${dia(+pts[9][0].toFixed(1), +pts[9][1].toFixed(1), 6, 'var(--brass)')}
      <text x="${pts[9][0].toFixed(1)}" y="${(pts[9][1] - 10).toFixed(1)}" text-anchor="middle" style="fill:var(--brass);font:600 12px var(--f-caps)">72</text></svg>`;
    const saved = NEWS.filter(n => S.bm.has(n.id));
    const sw = (act, on, label, ic, sub) => `<button class="li" data-act="${act}" role="switch" aria-checked="${on}"><span class="brass">${I(ic)}</span><span class="grow">${label}${sub ? `<br><span class="muted" style="font-size:12.5px">${sub}</span>` : ''}</span><span class="switch" aria-checked="${on}"></span></button>`;
    const link = (go, label, ic, val, act) => `<button class="li" ${go ? `data-go="${go}"` : ''} ${act ? `data-act="${act}"` : ''}><span class="brass">${I(ic)}</span><span class="grow">${label}</span><span class="muted" style="font-size:13px">${val}</span><span class="muted">${I('chevron', 's')}</span></button>`;
    return `<div class="screen">
      <div class="avatar-wrap"><span class="portrait lg" style="--size:96px"><span class="inner"><span class="ini">ГР</span></span></span><h1 class="display h1">Гравець</h1><span class="caps brass">${S.level === 'novice' ? 'НОВАЧОК' : 'ВЕТЕРАН'} · ДЕМО-ПРОФІЛЬ</span></div>
      <div class="card stats" style="border:1px solid var(--line)">${[['54%', 'ПЕРЕМОГИ', 'soul'], ['68', 'СЕР. ОЦІНКА', 'brass'], ['3', 'СЕРІЯ', 'amber']].map(([v, l, t]) => `<div><span class="num" style="color:${TONE[t]}">${v}</span><span class="caps muted" style="font-size:10px">${l}</span></div>`).join('')}</div>
      <div class="between"><h2 class="display h2">Оцінка за 10 матчів</h2><span class="num" style="font-size:15px;color:var(--soul)">+16</span></div>
      <div class="card" style="padding:12px 10px">${chart}</div>
      ${saved.length ? `<div class="between"><h2 class="display h2">Збережені статті</h2><span class="caps muted">${saved.length}</span></div><div style="display:flex;flex-direction:column;gap:12px">${saved.map(newsCard).join('')}</div>` : ''}
      <h2 class="display h2">Налаштування</h2>
      <div class="card list">
        ${sw('toggle-mark', S.mark, 'Позначати нові патчі', 'bell', 'Червона крапка на дзвіночку і мітка «НОВЕ»')}
        ${sw('toggle-mode', S.mode === 'bw', 'Чорно-білий режим', 'contrast', 'Увесь застосунок у відтінках сірого')}
        ${link(null, 'Рівень', 'flame', S.level === 'novice' ? 'Новачок' : 'Ветеран', 'toggle-level')}
        ${link('#heroes', 'Улюблені герої', 'star', S.fav.size || 'немає', 'fav-filter')}
        ${link(null, 'Збережені статті', 'bookmark', S.bm.size || 'немає', 'scroll-saved')}
        ${link(null, 'Встановити на iPhone', 'phone', '', 'install')}
        ${link(null, 'Почати спочатку', 'refresh', '', 'reset')}
      </div>
      <p class="muted" style="font-size:12px;margin:0">Налаштування, закладки й фото зберігаються лише на цьому пристрої.</p>
    </div>${tabbar('profile')}`;
  }

  function sheetHero(slug) {
    const h = HEROES.find(x => x.slug === slug); if (!h) return '';
    const notes = HERO_NOTES[slug] || []; const fav = S.fav.has(slug); const p = photo(slug);
    return `<div class="sheet-wrap" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(h.name)}">
      <div class="grab"></div>
      <div class="between" style="align-items:center"><span class="caps brass">${ROLES[h.role].toUpperCase()}</span><button class="icon-btn" data-act="close-sheet" aria-label="Закрити">${I('close')}</button></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">${portrait(h, true)}<h2 class="display" style="font-size:32px">${esc(h.name)}</h2><span class="muted" style="font-size:13px">У грі з: ${esc(h.rel)}</span></div>
      <div class="grid2">
        <label class="btn secondary" style="cursor:pointer">${I('camera')}${ownPhoto(slug) ? 'Змінити фото' : 'Своє фото'}<input type="file" accept="image/*" data-photo="${slug}" class="sr"></label>
        <button class="btn ${fav ? 'primary' : 'secondary'}" data-act="fav" data-slug="${slug}" aria-pressed="${fav}">${I('star')}${fav ? 'В улюблених' : 'В улюблені'}</button>
      </div>
      ${ownPhoto(slug) ? `<button class="btn ghost" data-act="del-photo" data-slug="${slug}">${I('trash', 's')} Повернути стандартне фото</button>` : ''}
      <h3 class="display h2">Останні зміни</h3>
      ${notes.length ? `<div class="card changes">${notes.map(([k, d]) => { const tone = k === 'buff' ? 'soul' : 'blood'; return `<div class="change" style="--c:${TONE[tone]}"><span class="ib">${I(k === 'buff' ? 'up' : 'down')}</span><div class="muted" style="font-size:13px">${esc(d)}</div>${tag(k === 'buff' ? 'БАФ' : 'НЕРФ', tone)}</div>`; }).join('')}</div>` : '<p class="muted" style="margin:0">В останніх патчах (жовтень 2026) суттєвих змін для цього героя не було.</p>'}
    </div></div>`;
  }
  function sheetInstall() {
    const steps = [['Відкрийте застосунок у Safari', 'Саме Safari: інші браузери на iPhone не вміють додавати застосунок на екран.'], ['Натисніть «Поділитися»', 'Квадрат зі стрілкою вгору внизу екрана.'], ['Оберіть «На початковий екран»', 'Прокрутіть список дій донизу, якщо пункту не видно одразу.'], ['Натисніть «Додати»', 'На робочому столі з’явиться іконка DeadlockNews. Застосунок відкриється на весь екран, без панелей браузера.']];
    return `<div class="sheet-wrap" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Встановлення на iPhone"><div class="grab"></div>
      <div class="between" style="align-items:center"><h2 class="display h2">Встановити на iPhone</h2><button class="icon-btn" data-act="close-sheet" aria-label="Закрити">${I('close')}</button></div>
      <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px">${steps.map(([t, d], i) => `<li style="display:grid;grid-template-columns:34px 1fr;gap:12px"><span class="num brass" style="font-size:20px;text-align:center">${i + 1}</span><span><b style="font-weight:600">${t}</b><br><span class="muted" style="font-size:13px">${d}</span></span></li>`).join('')}</ol>
      <button class="btn primary" data-act="close-sheet">Зрозуміло</button></div></div>`;
  }

  // ---------- router ----------
  const root = $('#app'); let sheet = '';
  function route() {
    document.documentElement.dataset.mode = S.mode === 'bw' ? 'bw' : 'color';
    let h = (location.hash || '').slice(1);
    if (!S.onb && !h) h = 'welcome';
    if (!h) h = 'news';
    let html;
    if (h === 'welcome') html = vOnboarding();
    else if (h.startsWith('article-')) html = vArticle(h.slice(8));
    else if (h === 'tips') html = vTips();
    else if (h === 'analysis') html = vAnalysis();
    else if (h === 'heroes' || h.startsWith('hero-')) { html = vHeroes(); if (h.startsWith('hero-')) sheet = sheetHero(h.slice(5)); }
    else if (h === 'profile') html = vProfile();
    else html = vNews();
    const keepScroll = render.same === h; render.same = h;
    root.innerHTML = html + sheet + (toastMsg ? `<div class="toast" role="status">${esc(toastMsg)}</div>` : '');
    if (!keepScroll) window.scrollTo(0, 0);
    onScroll();
  }
  const render = () => route();
  let toastMsg = '', toastT;
  const toast = m => { toastMsg = m; clearTimeout(toastT); toastT = setTimeout(() => { toastMsg = ''; const t = $('.toast'); if (t) t.remove(); }, 2200); render(); };
  const go = hash => { sheet = ''; if (location.hash === hash) render(); else location.hash = hash; };

  window.addEventListener('hashchange', () => { if (!location.hash.startsWith('#hero-')) sheet = ''; render(); });
  const onScroll = () => { const t = $('.top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); };
  window.addEventListener('scroll', onScroll, { passive: true });

  root.addEventListener('input', e => {
    if (e.target.id === 'hero-q' || e.target.id === 'news-q') {
      const el = e.target, pos = el.selectionStart;
      if (el.id === 'hero-q') S.heroQ = el.value; else S.newsQ = el.value;
      render(); const n = $('#' + el.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
    }
  });
  root.addEventListener('change', e => {
    const slug = e.target.dataset && e.target.dataset.photo; if (!slug || !e.target.files[0]) return;
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const s = 360, c = document.createElement('canvas'); c.width = c.height = s; const x = c.getContext('2d');
      const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
      const ok = LS.set('photo_' + slug, c.toDataURL('image/jpeg', .82));
      sheet = sheetHero(slug); toast(ok ? 'Фото додано' : 'Не вдалося зберегти фото: забагато даних на пристрої');
    }; img.onerror = () => toast('Цей файл не схожий на зображення'); img.src = fr.result; };
    fr.readAsDataURL(e.target.files[0]);
  });
  root.addEventListener('click', e => {
    const el = e.target.closest('button, [data-act], [data-go]'); if (!el || el.tagName === 'LABEL') return;
    if (el.classList.contains('sheet-wrap') && e.target !== el) return; // click inside sheet
    const d = el.dataset;
    if (d.secGo !== undefined) S.tipSec = d.secGo || null;
    if (d.go) { if (d.act === 'fav-filter') S.heroRole = 'fav'; return go(d.go); }
    if (d.cat) { S.cat = d.cat; return render(); }
    if (d.role) { S.heroRole = d.role; return render(); }
    if (d.sec !== undefined) { S.tipSec = d.sec || null; return render(); }
    if (d.level) { S.level = d.level; S.tipIdx = 0; save(); return render(); }
    if (d.hero) { sheet = sheetHero(d.hero); location.hash = '#hero-' + d.hero; if (!(location.hash.startsWith('#heroes') || location.hash.startsWith('#hero-'))) render(); return; }
    switch (d.act) {
      case 'start': S.onb = true; save(); return go('#news');
      case 'install': sheet = sheetInstall(); return render();
      case 'close-sheet': sheet = ''; if (location.hash.startsWith('#hero-')) { history.replaceState(null, '', '#heroes'); } return render();
      case 'toggle-search': S.newsSearch = !S.newsSearch; if (!S.newsSearch) S.newsQ = ''; render(); { const n = $('#news-q'); if (n) n.focus(); } return;
      case 'next-tip': S.tipIdx++; return render();
      case 'back': if (history.length > 1 && document.referrer !== undefined && render.prev) history.back(); else go('#news'); return;
      case 'bookmark': { const id = d.id; if (S.bm.has(id)) { S.bm.delete(id); save(); return toast('Прибрано із закладок'); } S.bm.add(id); save(); return toast('Збережено в закладки'); }
      case 'share': { const url = location.href.split('#')[0] + '#article-' + d.id; const done = () => toast('Посилання скопійовано'); try { navigator.clipboard.writeText(url).then(done, () => toast(url)); } catch (_) { toast(url); } return; }
      case 'fav': { const s = d.slug; S.fav.has(s) ? S.fav.delete(s) : S.fav.add(s); save(); sheet = sheetHero(s); return render(); }
      case 'del-photo': LS.del('photo_' + d.slug); sheet = sheetHero(d.slug); return toast('Повернуто стандартне фото');
      case 'toggle-mark': S.mark = !S.mark; save(); return render();
      case 'toggle-mode': S.mode = S.mode === 'bw' ? 'color' : 'bw'; save(); return render();
      case 'toggle-level': S.level = S.level === 'novice' ? 'veteran' : 'novice'; S.tipIdx = 0; save(); return render();
      case 'scroll-saved': { if (!S.bm.size) return toast('Збережіть статтю кнопкою-закладкою'); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      case 'reset': S.onb = false; save(); return go('#welcome');
    }
  });
  window.addEventListener('hashchange', () => { render.prev = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) { sheet = ''; if (location.hash.startsWith('#hero-')) history.replaceState(null, '', '#heroes'); render(); } });
  // ---------- live news from Steam (news.json is refreshed by a GitHub Action) ----------
  const fmtDate = ts => { try { return new Date(ts).toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' }).replace(' р.', ''); } catch (e) { return ''; } };
  function addSteam(items) {
    let added = 0;
    for (const it of items || []) {
      if (!it || !it.id || NEWS.some(n => n.id === it.id)) continue;
      const blocks = (it.blocks || []).filter(b => Array.isArray(b));
      const firstP = blocks.find(b => b[0] === 'p');
      const words = blocks.reduce((a, b) => a + (Array.isArray(b[1]) ? b[1].join(' ') : String(b[1])).split(/\s+/).length, 0);
      const isPatch = /update|patch/i.test(it.title);
      NEWS.push({ id: it.id, ts: it.ts, steam: true, cat: 'steam', tag: isPatch ? 'ПАТЧ STEAM' : 'STEAM', tone: isPatch ? 'brass' : 'sapph',
        date: fmtDate(it.ts), read: Math.max(1, Math.round(words / 200)), title: it.title,
        lead: firstP ? firstP[1] : '', body: blocks.filter(b => b !== firstP).map(b => [b[0], b[1]]), link: it.url });
      added++;
    }
    if (added) { NEWS.sort((a, b) => (b.ts || 0) - (a.ts || 0)); render(); }
    return added;
  }
  NEWS.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  try { const cached = LS.get('steam_news', null); if (cached) addSteam(cached.items); } catch (e) {}
  render();
  fetch('news.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(j => { if (j && Array.isArray(j.items)) { LS.set('steam_news', { items: j.items.slice(0, 25) }); addSteam(j.items); } }).catch(() => {});
})();

</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }</script>
</body>
</html>
