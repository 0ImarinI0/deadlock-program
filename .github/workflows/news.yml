name: Оновлення новин зі Steam

on:
  schedule:
    - cron: '17 */3 * * *'   # кожні 3 години
  workflow_dispatch: {}        # ручний запуск: Actions → Run workflow
  push:
    paths:
      - '.github/workflows/news.yml'
      - 'scripts/fetch-news.mjs'

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Завантажити новини
        run: node scripts/fetch-news.mjs
      - name: Зберегти news.json
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "Без змін"; exit 0
          fi
          git config user.name "deadlocknews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Новини зі Steam: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase && git push
