name: Розвідка API (одноразово)
on:
  push:
    paths: ['scripts/probe-api.mjs', '.github/workflows/probe.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/probe-api.mjs
      - run: |
          git config user.name "deadlocknews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json && git commit -m "Розвідка API" && git pull --rebase && git push
